name: Docker Build & Deploy

on:
  push:
    branches:
      - main   # Trigger workflow on push to main branch

env:
  AWS_REGION: us-east-1            # Change to your AWS region
  ECR_REPOSITORY: my-app           # Your ECR repository name
  IMAGE_TAG: latest                 # Docker image tag

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Set IMAGE_URI environment variable
      - name: Set image URI
        run: |
          echo "IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_URI .

      # 6. Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push $IMAGE_URI

      # 7. (Optional) Pull Docker image to test
      - name: Pull Docker image
        run: |
          docker pull $IMAGE_URI

      # 8. (Optional) Display pushed image info
      - name: Show pushed image info
        run: |
          echo "Docker image pushed: $IMAGE_URI"
            